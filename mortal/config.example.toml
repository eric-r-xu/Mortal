# This is only an example. Most values are dummy placeholders just to match the
# types; they are often not optimal and must be tuned.

[control]
# 5 for sanma builds (the only version they support)
version = 4
online = false

state_file = '/path/to/mortal.pth'
best_state_file = '/path/to/best.pth'
# optional: keeps a copy of the state at every test step, named `<steps>.pth`
checkpoint_dir = '/path/to/checkpoints'
tensorboard_dir = '/path/to/dir'

device = 'cuda:0'
enable_cudnn_benchmark = false
enable_amp = false
enable_compile = false

batch_size = 512
opt_step_every = 1

save_every = 400
test_every = 20000
submit_every = 400

# using env `TRAIN_PLAY_PROFILE`
[train_play.default]
games = 800
log_dir = '/path/to/train_play'
boltzmann_epsilon = 0.005
boltzmann_temp = 0.05
top_p = 1.0
repeats = 1

[test_play]
games = 3000
log_dir = '/path/to/test_play'

# for evaluate.py: scores checkpoints on held-out games
[eval]
globs = ['/path/to/val/**/*.json.gz']
device = 'cuda:0'
batch_size = 512
num_workers = 1
file_batch_size = 20

[dataset]
globs = ['/path/to/dataset/**/*.json.gz']
file_index = '/path/to/file_index.pth'
file_batch_size = 15
reserve_ratio = 0.0
num_workers = 1
player_names_files = []
num_epochs = 1
enable_augmentation = false
augmented_first = false

[env]
gamma = 1
# one pt per rank: 3 values in sanma, e.g. [4.0, 2.0, 0.0]
pts = [6.0, 4.0, 2.0, 0.0]
# scheduled hands per game: 8 = hanchan, 4 = East-only (tonpuu, Tenhou rules);
# 6 and 3 in sanma
game_length = 8

[resnet]
conv_channels = 192
num_blocks = 40

[cql]
min_q_weight = 5

[aux]
next_rank_weight = 0.2

[freeze_bn]
# `true` in online training
mortal = false

[optim]
eps = 1e-8
betas = [0.9, 0.999]
weight_decay = 0.1
max_grad_norm = 0

[optim.scheduler]
peak = 1e-4
final = 1e-4
warm_up_steps = 0
max_steps = 0

[baseline.train]
device = 'cuda:0'
enable_compile = false
# half precision for the trainee and the opponents in train play (default true)
enable_amp = true
state_file = '/path/to/baseline.pth'
# optional opponent pool: each session plays `state_file` with probability
# `anchor_ratio`, otherwise a uniform pick among the files matching `pool_glob`
# (such as the trainee's own checkpoints in `checkpoint_dir`)
# pool_glob = '/path/to/checkpoints/*.pth'
# anchor_ratio = 0.5

[baseline.test]
device = 'cuda:0'
enable_compile = false
state_file = '/path/to/baseline.pth'

[online]
history_window = 50
enable_compile = false

# optional: `ratio` of every batch is drawn from offline games (all seats)
# instead of self-play, with CQL on those rows at `min_q_weight` (0 = off)
# [online.mix]
# globs = ['/path/to/dataset/**/*.json.gz']
# ratio = 0.25
# min_q_weight = 1
# num_workers = 1

[online.remote]
host = '127.0.0.1'
# macOS's AirPlay Receiver listens on 5000; pick another port there
port = 5000

[online.server]
buffer_dir = '/path/to/buffer'
drain_dir = '/path/to/drain'
sample_reuse_rate = 0
sample_reuse_threshold = 0
capacity = 1600
force_sequential = false

[1v3]
seed_key = -1
games_per_iter = 2000
iters = 500
log_dir = '/path/to/1v3'

[1v3.challenger]
device = 'cuda:0'
name = 'mortal'
state_file = '/path/to/challenger.pth'
stochastic_latent = false
enable_compile = false
enable_amp = true
enable_rule_based_agari_guard = true

[1v3.champion]
device = 'cuda:0'
name = 'baseline'
state_file = '/path/to/baseline.pth'
stochastic_latent = false
enable_compile = false
enable_amp = true
enable_rule_based_agari_guard = true

[1v3.akochan]
enabled = false
dir = '/path/to/akochan'
tactics = '/path/to/tactics.json'

[grp]
state_file = '/path/to/grp.pth'

[grp.network]
hidden_size = 64
num_layers = 2

[grp.control]
device = 'cuda:0'
enable_cudnn_benchmark = false
tensorboard_dir = 'grp_v2/log'

batch_size = 512
save_every = 2000
val_steps = 400

[grp.dataset]
train_globs = [
    '/path/to/dataset/2019/**/*.json.gz',
    '/path/to/dataset/2020/**/*.json.gz',
    '/path/to/dataset/2021/01/**/*.json.gz',
    '/path/to/dataset/2021/02/**/*.json.gz',
    # ...
]
val_globs = [
    '/path/to/dataset/2021/10/**/*.json.gz',
    '/path/to/dataset/2021/11/**/*.json.gz',
    # ...
]
file_index = '/path/to/grp_file_index.pth'
file_batch_size = 50

[grp.optim]
lr = 1e-5
